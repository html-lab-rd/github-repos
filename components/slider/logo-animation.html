<!DOCTYPE html>

    <title>Scrolling Logo Track</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f5; /* Light background for contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .slider-container {
            width: 100%;
            max-width: 100vw;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
            background: #ffffff;
            padding: 20px 0; /* Add some vertical padding */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* Optional subtle shadow */
        }

        .logo-track {
            display: flex;
            /* The width needs to accommodate all original + duplicated images. 
               We use min-content to let it size based on its children, but 
               ensure the animation uses the correct transform. */
            width: max-content; 
            animation: scroll 40s linear infinite; /* Adjusted time for more images */
        }

        .logo-track img {
            width: 150px; /* Fixed width for better consistency across different aspect ratios */
            height: 100px; /* Fixed height to align them nicely */
            object-fit: contain; /* Ensure the whole logo fits within the dimensions */
            padding: 0 20px; /* Horizontal padding for spacing between logos */
            flex-shrink: 0;
            /* Optional: Add a subtle grayscale filter that clears on hover */
            filter: grayscale(100%) opacity(0.7);
            transition: filter 0.3s ease;
        }

        .logo-track img:hover {
            filter: grayscale(0%) opacity(1);
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            /* Translate by exactly half the width since we duplicated the list once */
            100% { transform: translateX(-50%); } 
        }

        /* Pause animation on hover for better user experience */
        .slider-container:hover .logo-track {
            animation-play-state: paused;
        }
    </style>
</head>
